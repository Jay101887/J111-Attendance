<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J111 System V5.6</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --primary: #007aff; --success: #34c759; --danger: #ff3b30; --warning: #ff9500; --bg: #f2f2f7; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg); color: #1c1c1e; padding-bottom: 20px; }
    .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid #d1d1d6; position: sticky; top: 0; z-index: 1000; }
    .tab-btn { flex: 1; text-align: center; padding: 14px 0; font-size: 13px; font-weight: 600; color: #8e8e93; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(0,122,255,0.03); }
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
    h3 { margin-bottom: 14px; font-size: 15px; border-left: 4px solid var(--primary); padding-left: 8px; }
    .gps-status-bar { padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 16px; border: 1px solid #ddd; text-align: center; }
    .gps-ok { background: #e6fcf5; color: #0ca678; border-color: #b2f2bb; }
    .gps-error { background: #fff5f5; color: #e03131; border-color: #ffc9c9; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #8e8e93; margin-bottom: 5px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 14px; background: #f2f2f7; appearance: none; }
    .refresh-btn { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--primary); background: #fff; color: var(--primary); font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .btn-container { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; transition: opacity 0.2s; }
    .btn-in { background: var(--success); }
    .btn-out { background: var(--primary); }
    .btn:disabled { background: #a1a1aa !important; cursor: not-allowed; opacity: 0.7; }
    .lock-screen { text-align: center; padding: 40px 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .stat-box { background: #f2f2f7; padding: 14px 8px; border-radius: 10px; text-align: center; font-size: 12px; }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); }
    #map { width: 100%; height: 400px; border-radius: 10px; z-index: 1; }
    .trade-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    .badge { background: rgba(0,122,255,0.1); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .live-card { background: #f6fff8; border-left: 5px solid var(--success); display: none; }
    .live-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 13px; margin-top: 10px; padding: 10px; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button class="tab-btn active" id="nav-punch" onclick="switchTab('punch-tab', this)">👷 打卡 Punch</button>
    <button class="tab-btn" id="nav-map" onclick="switchTab('map-tab', this)">📍 地图 Map</button>
    <button class="tab-btn" id="nav-dash" onclick="switchTab('dashboard-tab', this)">📊 看板 Dash</button>
  </div>

  <div id="punch-tab" class="tab-content active">
    <div class="card">
      <h3 id="t-form-title">员工身份校验登记 Identity</h3>
      <div id="gps-status" class="gps-status-bar">⏳ 正在获取定位 / Getting GPS...</div>
      
      <div class="form-group"><label>姓名 (Name)</label><input type="text" id="name" placeholder="请输入姓名"></div>
      <div class="form-group"><label>手机号 (Mobile)</label><input type="tel" id="phone" placeholder="8位数手机号"></div>
      <div class="form-group"><label>准证后四位 (FIN Last 4)</label><input type="text" id="fin" maxlength="4" style="text-transform: uppercase;" placeholder="例: 1234 或 123A"></div>
      <div class="form-group"><label>负责督工 (Supervisor)</label><select id="supervisor"></select></div>
      <div class="form-group"><label>工种 (Trade)</label><select id="trade"></select></div>
      <div class="form-group"><label>作业区域 (Area)</label><select id="area"></select></div>
      <div class="form-group"><label>工作内容 (Task Content)</label><input type="text" id="content" placeholder="选填 Optional"></div>
      
      <div class="btn-container">
        <button class="btn btn-in" id="b-in" onclick="submitAttendance('checkin')">签到 Check-In</button>
        <button class="btn btn-out" id="b-out" onclick="submitAttendance('checkout')">签退 Check-Out</button>
      </div>
    </div>
    
    <div id="liveCard" class="card live-card">
      <h3>今日出勤进度 Daily Status</h3>
      <p>当前状态: <b id="cardLabel" style="color:var(--primary)">--</b></p>
      <div class="live-grid">
        <div>🌅 白进: <b id="c_di">--</b></div><div>🌇 白出: <b id="c_do">--</b></div>
        <div>🌃 加进: <b id="c_oi">--</b></div><div>🌌 加出: <b id="c_oo">--</b></div>
        <div>🌙 夜进: <b id="c_ni">--</b></div><div>☀️ 夜出: <b id="c_no">--</b></div>
      </div>
    </div>
  </div>

  <div id="map-tab" class="tab-content">
    <div id="map-lock" class="card lock-screen">
      <p>🔐 管理员密码解锁 (Admin Only)</p>
      <input type="password" id="map-password" style="text-align:center;margin:10px 0;letter-spacing:4px;padding:8px;">
      <button class="btn btn-out" style="max-width:150px;margin:0 auto;display:block;padding:8px;" onclick="verifyAdmin('map')">Unlock</button>
    </div>
    <div id="map-inner" style="display:none">
      <button class="refresh-btn" onclick="fetchInitData()">🔄 强制同步现场人员定位</button>
      <div id="map"></div>
    </div>
  </div>

  <div id="dashboard-tab" class="tab-content">
    <div id="dash-lock" class="card lock-screen">
      <p>🔐 管理员密码解锁 (Admin Only)</p>
      <input type="password" id="dash-password" style="text-align:center;margin:10px 0;letter-spacing:4px;padding:8px;">
      <button class="btn btn-out" style="max-width:150px;margin:0 auto;display:block;padding:8px;" onclick="verifyAdmin('dash')">Unlock</button>
    </div>
    <div id="dash-inner" style="display:none">
      <div class="card" style="background:#e5e5ea">
        <h3 style="border-left-color:#636366">🎛️ 检索条件过滤</h3>
        <div class="form-group"><label>选择日期 (Date)</label><input type="date" id="filter-date" onchange="processAnalytics()"></div>
        <div class="form-group"><label>选择督工 (Supervisor)</label><select id="filter-supervisor" onchange="processAnalytics()"></select></div>
      </div>
      <div class="card">
        <h3>项目实战动态看板</h3>
        <div class="grid">
          <div class="stat-box"><div>当前在场人数</div><div class="stat-num" id="s_active">0</div></div>
          <div class="stat-box"><div>正常白班闭环</div><div class="stat-num" id="s_day">0</div></div>
          <div class="stat-box"><div>正常加班闭环</div><div class="stat-num" id="s_over">0</div></div>
          <div class="stat-box"><div>正常夜班闭环</div><div class="stat-num" id="s_night">0</div></div>
        </div>
      </div>
      <div class="card"><h3>当前在线工种分布</h3><div id="trade_breakdown"></div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ⚠️ 最后确认一次：确保这里的 API_URL 是你重新部署后拿到的那串最新链接！
    const API_URL = "https://script.google.com/macros/s/AKfycbzejNYzlV6jmhDHg_sUWZJJdIfkM_iSLemV5KQP9bSXLA3Fd99qg7fehSZN0JE5Yh_s/exec"; 
    const PASS = "J111Admin"; 
    
    // 修复：同步云端的 3200 米作为备用半径，防止弱网环境误判
    let siteConfig = { lat: 1.3521, lng: 103.8198, radius: 3200 };
    let rawLogs = [];
    let map = null, markerGroup = null, unlocked = false;

    function getLocalYYYYMMDD() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    }

    window.onload = () => {
      if (!localStorage.getItem('j111_dev_id')) {
        localStorage.setItem('j111_dev_id', "WEB_" + Math.random().toString(36).substr(2, 9));
      }
      
      document.getElementById("filter-date").value = getLocalYYYYMMDD();
      checkGPS();
      fetchInitData();
    };

    function switchTab(id, btnElement) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(id).classList.add('active');
      if (btnElement) btnElement.classList.add('active');

      if(id === 'map-tab' && unlocked) {
        setTimeout(() => { 
          if(!map) initMap(); 
          map.invalidateSize(); 
          processAnalytics(); 
        }, 300);
      }
    }

    function verifyAdmin(type) {
      if(document.getElementById(type+"-password").value === PASS) {
        unlocked = true;
        document.getElementById("map-lock").style.display="none"; 
        document.getElementById("map-inner").style.display="block";
        document.getElementById("dash-lock").style.display="none"; 
        document.getElementById("dash-inner").style.display="block";
        
        if(type === 'map') setTimeout(() => { initMap(); map.invalidateSize(); }, 300);
        processAnalytics();
      } else { 
        alert("密码错误！"); 
      }
    }

    function fetchInitData() {
      fetch(API_URL)
        .then(r => r.json())
        .then(res => {
          if (res.config) siteConfig = res.config; 
          rawLogs = res.rawLogs || [];
          fillSelect("trade", res.options.trades);
          fillSelect("area", res.options.areas);
          fillSelect("supervisor", res.options.supervisors);
          fillSelect("filter-supervisor", ["ALL", ...res.options.supervisors]);
          if(unlocked) processAnalytics();
        })
        .catch(e => console.error("数据拉取失败，请检查网络。"));
    }

    function fillSelect(id, arr) {
      let el = document.getElementById(id); if(!el) return;
      let val = el.value; el.innerHTML = ""; 
      arr.forEach(v => el.options.add(new Option(v, v)));
      if(val && arr.includes(val)) el.value = val;
    }

    function processAnalytics() {
      let targetDate = document.getElementById("filter-date").value;
      let targetSup = document.getElementById("filter-supervisor").value || "ALL";
      
      let activeWorkers = [];
      let stats = { d: 0, o: 0, n: 0 };
      let trades = {};

      rawLogs.forEach(worker => {
        if (worker.date !== targetDate) return;
        if (targetSup !== "ALL" && worker.supervisor !== targetSup) return;

        if (worker.statusLabel.includes("正常白班闭环")) stats.d++;
        if (worker.statusLabel.includes("加班闭环")) stats.o++;
        if (worker.statusLabel.includes("夜班闭环")) stats.n++;

        let isPresent = false;
        if (worker.dayIn && !worker.dayOut) isPresent = true;
        if (worker.overIn && !worker.overOut) isPresent = true;
        if (worker.nightIn && !worker.nightOut) isPresent = true;

        if (isPresent) {
          activeWorkers.push(worker);
          let t = worker.trade || "未分配";
          trades[t] = (trades[t] || 0) + 1;
        }
      });

      document.getElementById("s_active").innerText = activeWorkers.length;
      document.getElementById("s_day").innerText = stats.d;
      document.getElementById("s_over").innerText = stats.o;
      document.getElementById("s_night").innerText = stats.n;
      
      let html = ""; 
      for(let t in trades) {
        html += `<div class="trade-item"><span><b>${t}</b></span><span class="badge">${trades[t]} 人</span></div>`;
      }
      document.getElementById("trade_breakdown").innerHTML = html || "<div style='color:#8e8e93;text-align:center;padding:15px;'>当前筛选条件下无在场工人</div>";
      
      if(map && unlocked) renderMarkers(activeWorkers);
    }

    function initMap() {
      if (map !== null) return;
      map = L.map('map').setView([siteConfig.lat, siteConfig.lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.circle([siteConfig.lat, siteConfig.lng], {radius: siteConfig.radius, color:'red', fillOpacity:0.05}).addTo(map);
      markerGroup = L.layerGroup().addTo(map);
    }

    function renderMarkers(pts) {
      if(!markerGroup || !map) return;
      markerGroup.clearLayers();
      let latLngList = [];
      
      pts.forEach(p => {
        let lg = parseFloat(p.lng); let lt = parseFloat(p.lat);
        if(lg && lt) {
          latLngList.push([lt, lg]);
          let safeName = p.name.replace(/</g, "&lt;");
          let safeFin = p.fin.replace(/</g, "&lt;");
          let popupContent = `<b>${safeName} (${safeFin})</b><br>督工: ${p.supervisor}<br>工种: ${p.trade}<br>活动时间: ${p.lastTime || "未知"}`;
          L.marker([lt, lg]).addTo(markerGroup).bindPopup(popupContent);
        }
      });
      if(latLngList.length > 0) {
        map.fitBounds(L.latLngBounds(latLngList), { padding: [40, 40] });
      } else {
        map.setView([siteConfig.lat, siteConfig.lng], 16);
      }
    }

    function checkGPS() {
      if (!navigator.geolocation) {
        document.getElementById("gps-status").innerHTML = "❌ 浏览器不支持定位";
        return;
      }
      navigator.geolocation.getCurrentPosition(
        () => { 
          document.getElementById("gps-status").innerText="✅ GPS 定位就绪 / GPS Ready"; 
          document.getElementById("gps-status").className="gps-status-bar gps-ok"; 
        },
        (err) => { 
          document.getElementById("gps-status").innerText=`❌ 定位失败 (${err.message})`; 
          document.getElementById("gps-status").className="gps-status-bar gps-error"; 
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    const fetchWithTimeout = (url, options, timeout = 15000) => {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时 (Timeout)')), timeout))
      ]);
    };

    function submitAttendance(type) {
      let name = document.getElementById("name").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let fin = document.getElementById("fin").value.trim().toUpperCase();
      let supervisor = document.getElementById("supervisor").value;
      
      if(!name || !phone || fin.length !== 4 || !supervisor) { 
        alert("请完整填写姓名、手机、准证后4位及选择督工！\nPlease fill in all required fields!"); 
        return; 
      }

      let bIn = document.getElementById("b-in"); 
      let bOut = document.getElementById("b-out");
      bIn.disabled = true; bOut.disabled = true;
      bIn.innerText = "处理中..."; bOut.innerText = "处理中...";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          let payload = {
            action: type, 
            name: name, 
            phone: phone, 
            fin: fin, 
            supervisor: supervisor,
            trade: document.getElementById("trade").value, 
            area: document.getElementById("area").value,
            content: document.getElementById("content").value, 
            lat: pos.coords.latitude, 
            lng: pos.coords.longitude,
            deviceId: localStorage.getItem('j111_dev_id')
          };

          let dist = 2 * 6378137 * Math.asin(Math.sqrt(Math.pow(Math.sin((payload.lat-siteConfig.lat)*Math.PI/360),2) + Math.cos(payload.lat*Math.PI/180)*Math.cos(siteConfig.lat*Math.PI/180)*Math.pow(Math.sin((payload.lng-siteConfig.lng)*Math.PI/360),2)));
          payload.distance = Math.round(dist);

          fetchWithTimeout(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(res => {
              if(res.status === "success") {
                alert("登记成功！ Success!");
                if(res.card) {
                  document.getElementById("liveCard").style.display="block";
                  document.getElementById("cardLabel").innerText = res.card.label;
                  document.getElementById("c_di").innerText = res.card.dayIn || "--"; 
                  document.getElementById("c_do").innerText = res.card.dayOut || "--";
                  document.getElementById("c_oi").innerText = res.card.overIn || "--"; 
                  document.getElementById("c_oo").innerText = res.card.overOut || "--";
                  document.getElementById("c_ni").innerText = res.card.nightIn || "--"; 
                  document.getElementById("c_no").innerText = res.card.nightOut || "--";
                }
                fetchInitData();
              } else {
                alert("服务器返回异常，请联系管理员。");
              }
            })
            .catch((err) => { 
              alert("提交失败：" + err.message + "\n现场信号可能较差，请重试。"); 
            })
            .finally(() => {
              bIn.disabled = false; bOut.disabled = false;
              bIn.innerText = "签到 Check-In"; bOut.innerText = "签退 Check-Out";
            });
        }, 
        (err) => { 
          alert("无法获取定位：" + err.message + "\n请确保手机开启了GPS定位权限！");
          bIn.disabled = false; bOut.disabled = false;
          bIn.innerText = "签到 Check-In"; bOut.innerText = "签退 Check-Out";
        }, 
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
