<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J111 项目智能化多功能打卡终端</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { 
      --primary: #007aff; 
      --success: #34c759; 
      --danger: #ff3b30; 
      --warning: #ff9500;
      --bg: #f2f2f7; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #1c1c1e; padding-bottom: 20px; }
    
    /* 顶级粘性高颜值导航栏 */
    .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid #d1d1d6; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .tab-btn { flex: 1; text-align: center; padding: 14px 0; font-size: 14px; font-weight: 600; color: #8e8e93; border: none; background: none; cursor: pointer; transition: all 0.2s ease; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(0,122,255,0.03); }
    
    /* 区域自适应 */
    .tab-content { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    /* 卡片式设计 (Ins Style Block) */
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); }
    h3 { margin-bottom: 14px; font-size: 16px; color: #3a3a3c; border-left: 4px solid var(--primary); padding-left: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    /* 表单美化 */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #8e8e93; margin-bottom: 5px; text-transform: uppercase; }
    input, select { width: 100%; padding: 12px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 15px; background: #f2f2f7; transition: all 0.2s ease; -webkit-appearance: none; }
    input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
    
    /* 按钮组 */
    .btn-container { display: flex; gap: 12px; margin-top: 20px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: opacity 0.1s ease; }
    .btn:active { opacity: 0.85; }
    .btn-in { background: var(--success); }
    .btn-out { background: var(--primary); }
    
    /* 核心看板大数字网格 */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
    .stat-box { background: #f2f2f7; padding: 14px 8px; border-radius: 10px; text-align: center; border: 1px solid rgba(0,0,0,0.01); }
    .stat-title { font-size: 12px; color: #636366; font-weight: 500; }
    .stat-num { font-size: 26px; font-weight: 700; color: var(--primary); margin-top: 4px; }
    
    /* 员工出勤感知卡片 */
    .live-card { background: linear-gradient(135deg, #ffffff 0%, #f6fff8 100%); border-left: 5px solid var(--success); display: none; }
    .live-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 13px; margin-top: 10px; background: rgba(0,0,0,0.02); padding: 10px; border-radius: 8px; }
    .live-grid div { padding: 4px 0; color: #48484a; }
    .live-grid b { color: #1c1c1e; font-size: 14px; }

    /* 开源 Leaflet 地图样式优化 */
    #map { width: 100%; height: 460px; border-radius: 10px; background: #e5e5ea; z-index: 1; }
    .action-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .refresh-btn { flex: 1; padding: 11px; border-radius: 8px; border: 1px solid var(--primary); background: #fff; color: var(--primary); font-weight: 600; font-size: 14px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .refresh-btn:hover { background: rgba(0,122,255,0.05); }
    
    /* 工种明细列表样式 */
    .trade-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid #f2f2f7; }
    .trade-item:last-child { border-bottom: none; }
    .badge { background: rgba(0,122,255,0.1); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('punch-tab')">👷 考勤打卡</button>
    <button class="tab-btn" onclick="switchTab('map-tab')">📍 实时现场地图</button>
    <button class="tab-btn" onclick="switchTab('dashboard-tab')">📊 综合管理看板</button>
  </div>

  <div id="punch-tab" class="tab-content active">
    <div class="card">
      <h3>员工身份校验登记</h3>
      <div class="form-group">
        <label>员工姓名 (Full Name as per WP)</label>
        <input type="text" id="name" placeholder="请输入完整护照/准证姓名">
      </div>
      <div class="form-group">
        <label>本地手机号码 (Singapore Mobile Number)</label>
        <input type="tel" id="phone" placeholder="请输入8位本地手机号">
      </div>
      <div class="form-group">
        <label>准证号码最后四位 (FIN Last 4)</label>
        <input type="text" id="fin" placeholder="例如: 567B" maxlength="4" style="text-transform: uppercase;">
      </div>
      <div class="form-group">
        <label>所属作业工种 (Trade Team)</label>
        <select id="trade"><option value="">正在从云端安全拉取...</option></select>
      </div>
      <div class="form-group">
        <label>当前具体作业区域 (Working Area)</label>
        <select id="area"><option value="">正在从云端安全拉取...</option></select>
      </div>
      <div class="form-group">
        <label>今日具体工作内容摘要 (Work Content)</label>
        <input type="text" id="content" placeholder="填写示例: Precast box girder segment alignment">
      </div>
      
      <div class="btn-container">
        <button class="btn btn-in" onclick="submitAttendance('checkin')">上班签到 (Check-In)</button>
        <button class="btn btn-out" onclick="submitAttendance('checkout')">下班签退 (Check-Out)</button>
      </div>
    </div>

    <div id="liveCard" class="card live-card">
      <h3>您的今日考勤清算进度 <span id="cardLabel" style="font-size:12px; background:var(--success); color:#fff; padding:2px 8px; border-radius:10px;">--</span></h3>
      <div class="live-grid">
        <div>🌅 白班签到: <b id="c_di">--</b></div>
        <div>🌇 白班签退: <b id="c_do">--</b></div>
        <div>🌃 加班签到: <b id="c_oi">--</b></div>
        <div>🌌 加班签退: <b id="c_oo">--</b></div>
        <div>🌙 夜班签到: <b id="c_ni">--</b></div>
        <div>☀️ 夜班签退: <b id="c_no">--</b></div>
      </div>
    </div>
  </div>

  <div id="map-tab" class="tab-content">
    <div class="action-row">
      <button class="refresh-btn" onclick="loadMap()">🔄 刷新现场实时标记点</button>
    </div>
    <div class="card" style="padding: 6px;">
      <div id="map"></div>
    </div>
  </div>

  <div id="dashboard-tab" class="tab-content">
    <div class="action-row">
      <button class="refresh-btn" onclick="fetchInitData()">🔄 刷新全盘看板数据</button>
    </div>
    <div class="card">
      <h3>项目当前实战动态看板</h3>
      <div class="grid">
        <div class="stat-box"><div class="stat-title">当前在场总人数</div><div class="stat-num" id="s_active">0</div></div>
        <div class="stat-box"><div class="stat-title">正常白班闭环数</div><div class="stat-num" id="s_day">0</div></div>
        <div class="stat-box"><div class="stat-title">正常加班闭环数</div><div class="stat-num" id="s_over">0</div></div>
        <div class="stat-box"><div class="stat-title">正常夜班闭环数</div><div class="stat-num" id="s_night">0</div></div>
      </div>
    </div>
    <div class="card">
      <h3>当前在线工种分布明细</h3>
      <div id="trade_breakdown" style="padding-top: 4px;">正在清算工种...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 🔒 请在此处精准粘贴您最新的网络应用部署 URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzejNYzlV6jmhDHg_sUWZJJdIfkM_iSLemV5KQP9bSXLA3Fd99qg7fehSZN0JE5Yh_s/exec"; 
    
    let map = null, markerGroup = null;
    let siteConfig = { lat: 1.3521, lng: 103.8198, radius: 150 };
    let deviceFingerprint = "";

    // 页面加载触发自动登记与环境拉取
    window.onload = function() {
      // 安全设备防代打卡：生成本地专属不可逆指纹
      if(!localStorage.getItem('j111_dev_id')) {
        localStorage.setItem('j111_dev_id', 'DEV-' + Math.random().toString(36).substring(2, 11).toUpperCase());
      }
      deviceFingerprint = localStorage.getItem('j111_dev_id');
      fetchInitData();
    };

    // 选项卡无缝平滑横向切换控制
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
      
      // 切换至地图选项卡时，触发按需高渲染渲染，解决大小自适应断档问题
      if(tabId === 'map-tab') {
        setTimeout(initMap, 150);
      }
    }

    // 后端全功能接口拉取与看板数据重渲染引擎（严格对齐最新 16 列）
    function fetchInitData() {
      fetch(API_URL).then(r => r.json()).then(res => {
        if(res.config) siteConfig = res.config;
        
        // 动态回填前端打卡表单的可选参数
        renderSelect("trade", res.options.trades);
        renderSelect("area", res.options.areas);
        
        // 精准刷新统计看板数据看板
        document.getElementById("s_active").innerText = res.analytics.stats.totalActive;
        document.getElementById("s_day").innerText = res.analytics.stats.dayClosed;
        document.getElementById("s_over").innerText = res.analytics.stats.overClosed;
        document.getElementById("s_night").innerText = res.analytics.stats.nightClosed;
        
        // 精准刷新工种分布面板明细
        let tHtml = "";
        for(let key in res.analytics.stats.trades) {
          tHtml += `
            <div class="trade-item">
              <span>👷 <b>${key}</b></span>
              <span class="badge">当前在场: ${res.analytics.stats.trades[key]} 人</span>
            </div>
          `;
        }
        document.getElementById("trade_breakdown").innerHTML = tHtml || "<div style='color:#8e8e93;text-align:center;'>当前施工现场暂无出勤人员</div>";
      }).catch(err => console.error("云端连线中断:", err));
    }

    function renderSelect(id, arr) {
      let el = document.getElementById(id); el.innerHTML = "";
      arr.forEach(v => el.options.add(new Option(v, v)));
    }

    // 📍 初始化 Leaflet 地图核心层
    function initMap() {
      if (map !== null) { map.invalidateSize(); return; }
      
      // 初始化绑定地图DOM并聚焦围栏中心
      map = L.map('map').setView([siteConfig.lat, siteConfig.lng], 16);
      
      // 挂载免 API Key 的开源 OpenStreetMap 全球高质量瓦片
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);
      
      // 绘制工地电子防作弊围栏红圈
      L.circle([siteConfig.lat, siteConfig.lng], {
        color: '#ff3b30', fillColor: '#ff3b30', fillOpacity: 0.12, radius: siteConfig.radius
      }).addTo(map);
      
      markerGroup = L.layerGroup().addTo(map);
      loadMap();
    }

    // 🔄 异步动态刷新在场工友点位图，智能触发 fitBounds 缩放
    function loadMap() {
      if(!map || !markerGroup) return;
      markerGroup.clearLayers();
      
      fetch(API_URL).then(r => r.json()).then(res => {
        let points = [];
        if(res.analytics && res.analytics.mapData) {
          res.analytics.mapData.forEach(p => {
            if(!p.lat || !p.lon) return;
            points.push([p.lat, p.lon]);
            
            // 构建高质感移动端气泡视窗
            let popupContent = `
              <div style="font-size:12px; line-height:1.6; min-width:140px;">
                <b style="color:var(--primary); font-size:14px; display:block; margin-bottom:4px;">${p.name}</b>
                🆔 <b>准证后四位:</b> ${p.fin}<br>
                ⏱️ <b>最新打卡时间:</b> ${p.time}<br>
                🏗️ <b>作业班组工种:</b> ${p.trade}<br>
                🚧 <b>现场所处区域:</b> ${p.area}
              </div>
            `;
            L.marker([p.lat, p.lon]).addTo(markerGroup).bindPopup(popupContent);
          });
        }
        
        // 自动缩放视角，将全量工友完美包络入当前视野
        if(points.length > 0) {
          map.fitBounds(L.latLngBounds(points), { padding: [40, 40] });
        } else {
          map.setView([siteConfig.lat, siteConfig.lng], 16);
        }
      }).catch(err => alert("地图点位拉取失败: " + err));
    }

    // 👷 提交流水考勤基础数据核心事务
    function submitAttendance(actionType) {
      let name = document.getElementById("name").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let fin = document.getElementById("fin").value.trim().toUpperCase();
      
      if(!name || !phone || fin.length !== 4) {
        alert("🚨 提交阻断：请务必完整填写 姓名、本地手机号 以及 4位准证尾号！"); return;
      }
      
      // 激活手机高精度 GPS 定位捕获
      navigator.geolocation.getCurrentPosition(pos => {
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;
        
        // 高精度哈弗辛多维数学公式距离清算
        let radLat1 = lat * Math.PI / 180, radLat2 = siteConfig.lat * Math.PI / 180;
        let diffLng = (lng - siteConfig.lng) * Math.PI / 180;
        let distance = 2 * Math.asin(Math.sqrt(Math.pow(Math.sin((radLat1 - radLat2)/2),2) + Math.cos(radLat1)*Math.cos(radLat2)*Math.pow(Math.sin(diffLng/2),2))) * 6378137;
        
        let payload = {
          action: actionType, name: name, phone: phone, fin: fin,
          trade: document.getElementById("trade").value,
          area: document.getElementById("area").value,
          content: document.getElementById("content").value,
          lat: lat, lng: lng, distance: distance, siteRadius: siteConfig.radius,
          deviceId: deviceFingerprint
        };
        
        // 发射 POST 流水请求
        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(r => r.json()).then(res => {
          if(res.status === 'success' || res.status === 'updated') {
            alert(`🎉 操作成功！已成功记录考勤时间: ${res.time || "云端已同步"}`);
            
            // 实时激活渲染“今日出勤感知卡片”
            if(res.card) {
              document.getElementById("liveCard").style.display = "block";
              document.getElementById("cardLabel").innerText = res.card.label;
              document.getElementById("c_di").innerText = res.card.dayIn;
              document.getElementById("c_do").innerText = res.card.dayOut;
              document.getElementById("c_oi").innerText = res.card.overIn;
              document.getElementById("c_oo").innerText = res.card.overOut;
              document.getElementById("c_ni").innerText = res.card.nightIn;
              document.getElementById("c_no").innerText = res.card.nightOut;
              
              // 让页面顺滑滚动，帮助工友一眼看清卡片变化
              document.getElementById("liveCard").scrollIntoView({ behavior: 'smooth' });
            }
            fetchInitData();
          } else {
            alert(res.msg || "提交失败，请联系项目管理组。");
          }
        });
      }, err => {
        alert("❌ 打卡失败：无法获取高精度 GPS 定位信息。请在手机设置或微信中开启该网页的定位获取权限！");
      }, { enableHighAccuracy: true, timeout: 8000 });
    }
  </script>
</body>
</html>
