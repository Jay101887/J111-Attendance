<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J111 现场智能考勤端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>input, select, textarea { font-size: 16px !important; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
            <h1 id="appTitle" class="text-xl font-bold tracking-wider">J111 项目签到</h1>
            <select id="langSelect" onchange="switchLanguage()" class="bg-blue-700 text-white text-sm rounded px-2 py-1 outline-none">
                <option value="zh">中文</option><option value="en">English</option><option value="bn">বাংলা</option>
            </select>
        </div>

        <div class="p-6">
            <div class="text-center mb-6 bg-gray-100 py-3 rounded-lg border border-gray-200">
                <p id="dateDisplay" class="text-gray-500 text-sm">同步新加坡时间...</p>
                <p id="timeDisplay" class="text-3xl font-mono font-bold text-gray-800 mt-1">--:--:--</p>
                <p class="text-[10px] text-gray-400 mt-1">设备识别号: <span id="deviceShow">--</span></p>
            </div>

            <form id="attendanceForm" class="space-y-4">
                <div><label id="labelName" class="block text-sm font-medium text-gray-700 mb-1">姓名</label><input type="text" id="workerName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label id="labelFin" class="block text-sm font-medium text-gray-700 mb-1">准证后四位</label><input type="text" id="workerFin" maxlength="4" required class="w-full px-4 py-2 border border-gray-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label id="labelTrade" class="block text-sm font-medium text-gray-700 mb-1">工种</label><select id="workerTrade" required class="w-full px-4 py-2 border rounded-lg bg-white"></select></div>
                    <div><label id="labelArea" class="block text-sm font-medium text-gray-700 mb-1">区域</label><select id="workerArea" required class="w-full px-4 py-2 border rounded-lg bg-white"></select></div>
                </div>
                <div><label id="labelSupervisor" class="block text-sm font-medium text-gray-700 mb-1">负责督工</label><select id="workerSupervisor" required class="w-full px-4 py-2 border rounded-lg bg-white"></select></div>
                <div><label id="labelContent" class="block text-sm font-medium text-gray-700 mb-1">工作内容</label><textarea id="workerContent" required rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea></div>

                <div class="text-xs text-orange-600 bg-orange-50 p-2 rounded flex items-center border border-orange-100"><span id="gpsText">请确保已开启手机 GPS 定位服务。</span></div>

                <div class="flex gap-4 pt-2">
                    <button type="button" onclick="submitAttendance('checkin')" id="btnCheckIn" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition">上班签到</button>
                    <button type="button" onclick="submitAttendance('checkout')" id="btnCheckOut" class="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition">下班签到</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxQKD7AfUphbLQapj4CrCkvy7dlrgutGAi8hhAjw0eCdl2w8iSSQfVcwd7253eBB_f_/exec"; // 必须替换为新的部署链接
        let siteLat, siteLng, siteRadius;
        
        let deviceUuid = localStorage.getItem('j111_device_uuid');
        if (!deviceUuid) {
            deviceUuid = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem('j111_device_uuid', deviceUuid);
        }
        document.getElementById('deviceShow').innerText = deviceUuid;

        const i18n = {
            zh: { title: "J111 项目签到", name: "姓名", fin: "准证后四位 (FIN)", trade: "工种", area: "工作区域", supervisor: "负责领导 / 督工", content: "今日工作内容", gpsWarning: "请确保已开启手机 GPS 定位服务。", checkIn: "上班签到", checkOut: "下班签到", success: "考勤已成功记录！", outWall: "无法签到：不在工地范围内！距离: ", syncing: "同步中..." },
            en: { title: "J111 Attendance", name: "Name", fin: "FIN Last 4", trade: "Trade", area: "Area", supervisor: "Supervisor", content: "Task", gpsWarning: "Ensure Phone GPS is ON.", checkIn: "Check In", checkOut: "Check Out", success: "Attendance recorded!", outWall: "Failed: Outside boundary. Distance: ", syncing: "Syncing..." }
        };

        let currentLang = navigator.language.startsWith('zh') ? 'zh' : 'en';
        
        function switchLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const dict = i18n[currentLang];
            document.getElementById('appTitle').innerText = dict.title;
            document.getElementById('labelName').innerText = dict.name;
            document.getElementById('labelFin').innerText = dict.fin;
            document.getElementById('labelTrade').innerText = dict.trade;
            document.getElementById('labelArea').innerText = dict.area;
            document.getElementById('labelSupervisor').innerText = dict.supervisor;
            document.getElementById('labelContent').innerText = dict.content;
            document.getElementById('gpsText').innerText = dict.gpsWarning;
            document.getElementById('btnCheckIn').innerText = dict.checkIn;
            document.getElementById('btnCheckOut').innerText = dict.checkOut;
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('dateDisplay').innerText = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Singapore', dateStyle: 'full' }).format(now);
            document.getElementById('timeDisplay').innerText = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Singapore', timeStyle: 'medium', hour12: false }).format(now);
        }, 1000);

        window.onload = function() {
            switchLanguage();
            fetch(API_URL).then(res => res.json()).then(data => {
                siteLat = data.config.lat; siteLng = data.config.lng; siteRadius = data.config.radius;
                const fillSel = (id, arr) => {
                    const el = document.getElementById(id); el.innerHTML = `<option value="" disabled selected>选择...</option>`;
                    arr.forEach(i => el.options.add(new Option(i, i)));
                };
                fillSel('workerTrade', data.options.trades); fillSel('workerArea', data.options.areas); fillSel('workerSupervisor', data.options.supervisors);
            });
        };

        function getDistance(lat1, lon1, lat2, lon2) {
            const p = 0.017453292519943295; const c = Math.cos;
            const a = 0.5 - c((lat2 - lat1) * p)/2 + c(lat1 * p) * c(lat2 * p) * (1 - c((lon2 - lon1) * p))/2;
            return 12742000 * Math.asin(Math.sqrt(a)); 
        }

        function submitAttendance(actionType) {
            const form = document.getElementById('attendanceForm');
            if(!form.checkValidity()) { form.reportValidity(); return; }
            if (!navigator.geolocation) { alert("GPS Unsupported"); return; }
            
            const btn = actionType === 'checkin' ? document.getElementById('btnCheckIn') : document.getElementById('btnCheckOut');
            const originalText = btn.innerText;
            btn.innerText = i18n[currentLang].syncing; btn.disabled = true;

            navigator.geolocation.getCurrentPosition(pos => {
                const distance = getDistance(pos.coords.latitude, pos.coords.longitude, siteLat, siteLng);
                if (distance > siteRadius) {
                    alert(i18n[currentLang].outWall + Math.round(distance) + "m (Max: " + siteRadius + "m)");
                    btn.innerText = originalText; btn.disabled = false; return;
                }

                const payload = {
                    action: actionType, name: document.getElementById('workerName').value.trim(),
                    fin: document.getElementById('workerFin').value.toUpperCase().trim(),
                    trade: document.getElementById('workerTrade').value, area: document.getElementById('workerArea').value,
                    supervisor: document.getElementById('workerSupervisor').value, content: document.getElementById('workerContent').value.trim(),
                    lat: pos.coords.latitude, lng: pos.coords.longitude, distance: distance, siteRadius: siteRadius, deviceId: deviceUuid
                };

                // 核心更新：使用标准 text/plain 防止 CORS 拦截，且能读取真实状态
                fetch(API_URL, { 
                    method: "POST", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload) 
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') { alert(i18n[currentLang].success); form.reset(); switchLanguage(); }
                })
                .catch(err => alert("网络错误，请稍后重试！"))
                .finally(() => { btn.innerText = originalText; btn.disabled = false; });
            }, err => { alert("无法获取GPS定位"); btn.innerText = originalText; btn.disabled = false; }, { enableHighAccuracy: true, timeout: 8000 });
        }
    </script>
</body>
</html>
