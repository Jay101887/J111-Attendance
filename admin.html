<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J111 智能核心后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6 flex items-center justify-center">

    <div id="loginOverlay" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6">
        <h2 class="text-xl font-bold text-gray-800 text-center mb-4">🔒 J111 考勤中枢授权</h2>
        <input type="password" id="inputPassword" placeholder="输入控制台密码" class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-gray-800">
        <button onclick="verifyAdmin()" class="w-full bg-gray-800 text-white py-2.5 rounded-lg font-bold shadow">进入控制台</button>
    </div>

    <div id="adminContent" class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden hidden">
        <div class="bg-slate-800 p-5 text-white flex justify-between items-center">
            <h1 class="text-lg font-bold">⚙️ J111 数字化考勤大屏系统</h1>
            <button onclick="location.reload()" class="text-xs bg-slate-700 px-3 py-1.5 rounded hover:bg-slate-600 transition">🔄 刷新数据</button>
        </div>

        <div class="flex border-b bg-slate-50">
            <button onclick="switchTab('board')" id="tab-board" class="flex-1 py-3 text-center font-bold text-slate-800 border-b-2 border-slate-800 text-sm">📊 班次数据看板</button>
            <button onclick="switchTab('radar')" id="tab-radar" class="flex-1 py-3 text-center font-medium text-slate-500 text-sm">🛰️ 现场实时布控图</button>
            <button onclick="switchTab('cfg')" id="tab-cfg" class="flex-1 py-3 text-center font-medium text-slate-500 text-sm">⚙️ 考勤规则与配置</button>
        </div>

        <div class="p-6">
            <div id="sec-board" class="space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-200"><p class="text-[11px] text-blue-600 font-medium">白班完成闭环</p><p id="cnt-day" class="text-xl font-bold text-blue-900 mt-1">-- 人</p></div>
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-200"><p class="text-[11px] text-amber-600 font-medium">常规加班闭环</p><p id="cnt-ot" class="text-xl font-bold text-amber-900 mt-1">-- 人</p></div>
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200"><p class="text-[11px] text-emerald-600 font-medium">白天无记录特班</p><p id="cnt-special" class="text-xl font-bold text-emerald-900 mt-1">-- 人</p></div>
                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-200"><p class="text-[11px] text-indigo-600 font-medium">再次上班闭环</p><p id="cnt-re" class="text-xl font-bold text-indigo-900 mt-1">-- 人</p></div>
                    <div class="bg-purple-50 p-3 rounded-xl border border-purple-200"><p class="text-[11px] text-purple-600 font-medium">晚班/夜班闭环</p><p id="cnt-night" class="text-xl font-bold text-purple-900 mt-1">-- 人</p></div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-600 mb-3 text-center">今日到场各工种总人数汇总</h3>
                    <canvas id="chartSummary" class="max-h-48"></canvas>
                </div>
            </div>

            <div id="sec-radar" class="space-y-4 hidden flex flex-col items-center">
                <div class="w-full flex justify-between text-xs text-slate-500"><span id="lbl-total">当前在场总人数: --人</span><span>圆心为工地基准坐标点</span></div>
                <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 shadow-2xl relative"><canvas id="siteMapCanvas" width="300" height="300"></canvas></div>
                <div id="jobLegendContainer" class="w-full grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs pt-2"></div>
            </div>

            <div id="sec-cfg" class="space-y-6 hidden">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 space-y-4">
                    <h3 class="text-xs font-bold text-blue-700">📍 地理围栏参数</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label class="text-xs font-medium text-slate-600">中心纬度</label><input type="text" id="cfgLat" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></div>
                        <div><label class="text-xs font-medium text-slate-600">中心经度</label><input type="text" id="cfgLng" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></div>
                        <div><label class="text-xs font-medium text-slate-600">围栏半径(米)</label><input type="number" id="cfgRadius" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></div>
                    </div>
                </div>

                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 space-y-4">
                    <h3 class="text-xs font-bold text-emerald-700">⏱️ 签到时间规则与阈值设定</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label class="text-xs font-medium text-slate-600">标准白班上班</label><input type="text" id="cfgStdIn" placeholder="如 08:00" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></div>
                        <div><label class="text-xs font-medium text-slate-600">标准白班下班</label><input type="text" id="cfgStdOut" placeholder="如 17:00" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></div>
                        <div><label class="text-xs font-medium text-slate-600">迟到/早退缓冲(分钟)</label><input type="number" id="cfgBufferMin" placeholder="如 15" class="w-full px-3 py-1.5 border rounded text-sm mt-1"></div>
                    </div>
                </div>

                <div class="space-y-3 bg-amber-50 p-4 rounded-xl border border-amber-200">
                    <h3 class="text-xs font-bold text-amber-700">📋 下拉单选项目管理</h3>
                    <div><label class="text-xs font-medium text-slate-700">允许工种列表 (逗号隔开)</label><textarea id="listTrades" rows="2" class="w-full px-3 py-2 border rounded text-sm mt-1"></textarea></div>
                    <div><label class="text-xs font-medium text-slate-700">工作区域划分 (逗号隔开)</label><textarea id="listAreas" rows="2" class="w-full px-3 py-2 border rounded text-sm mt-1"></textarea></div>
                    <div><label class="text-xs font-medium text-slate-700">负责督工列表 (逗号隔开)</label><textarea id="listSupervisors" rows="2" class="w-full px-3 py-2 border rounded text-sm mt-1"></textarea></div>
                </div>
                <button onclick="saveConfigToCloud()" id="btnSave" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow transition">下发规则并强制同步</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxQKD7AfUphbLQapj4CrCkvy7dlrgutGAi8hhAjw0eCdl2w8iSSQfVcwd7253eBB_f_/exec"; // 必须替换为新部署链接
        let barChart = null;

        function verifyAdmin() {
            if(document.getElementById('inputPassword').value === "J111Admin2026") {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                document.body.classList.remove('flex','items-center');
                loadCloudData();
            }
        }

        function switchTab(name) {
            ['board', 'radar', 'cfg'].forEach(t => {
                document.getElementById('sec-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).className = "flex-1 py-3 text-center font-medium text-slate-500 text-sm";
            });
            document.getElementById('sec-' + name).classList.remove('hidden');
            document.getElementById('tab-' + name).className = "flex-1 py-3 text-center font-bold text-slate-800 border-b-2 border-slate-800 text-sm";
        }

        function loadCloudData() {
            fetch(API_URL).then(res => res.json()).then(data => {
                document.getElementById('cfgLat').value = data.config.lat;
                document.getElementById('cfgLng').value = data.config.lng;
                document.getElementById('cfgRadius').value = data.config.radius;
                document.getElementById('cfgStdIn').value = data.config.stdIn || "08:00";
                document.getElementById('cfgStdOut').value = data.config.stdOut || "17:00";
                document.getElementById('cfgBufferMin').value = data.config.bufferMin || 0;
                
                document.getElementById('listTrades').value = data.options.trades.join(', ');
                document.getElementById('listAreas').value = data.options.areas.join(', ');
                document.getElementById('listSupervisors').value = data.options.supervisors.join(', ');

                const s = data.analytics.stats;
                document.getElementById('cnt-day').innerText = s.dayShiftClosed + " 人";
                document.getElementById('cnt-ot').innerText = s.overtimeClosed + " 人";
                document.getElementById('cnt-special').innerText = s.specialCaseCount + " 人";
                document.getElementById('cnt-re').innerText = s.reWorkClosed + " 人";
                document.getElementById('cnt-night').innerText = s.nightShiftClosed + " 人";

                if(barChart) barChart.destroy();
                barChart = new Chart(document.getElementById('chartSummary').getContext('2d'), {
                    type: 'bar', data: { labels: Object.keys(s.tradeDetails), datasets: [{ data: Object.values(s.tradeDetails), backgroundColor: '#3B82F6', borderRadius: 4 }] },
                    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                });
                drawRadar(data.analytics.workers, data.config.radius);
            });
        }

        function drawRadar(workers, radius) {
            document.getElementById('lbl-total').innerText = "当前在场总人数: " + workers.length + " 人";
            const canvas = document.getElementById('siteMapCanvas'); const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2; const cy = canvas.height / 2; const rMax = cx - 20;
            ctx.clearRect(0,0,300,300);
            
            ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.arc(cx,cy,rMax,0,2*Math.PI); ctx.stroke();
            ctx.fillStyle = '#0F172A'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx,cy,rMax*0.5,0,2*Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx-rMax,cy); ctx.lineTo(cx+rMax,cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx,cy-rMax); ctx.lineTo(cx,cy+rMax); ctx.stroke();
            ctx.fillStyle = '#EF4444'; ctx.beginPath(); ctx.arc(cx,cy,4,0,2*Math.PI); ctx.fill();

            const colors = ['#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899'];
            const trades = [...new Set(workers.map(w => w.trade))];
            
            const legend = document.getElementById('jobLegendContainer'); legend.innerHTML = "";
            trades.forEach((t, idx) => {
                legend.innerHTML += `<div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${colors[idx%5]}"></span><span class="text-slate-400 truncate">${t}</span></div>`;
            });

            workers.forEach(w => {
                const scale = rMax / radius;
                const px = cx + (w.relX * scale); const py = cy - (w.relY * scale);
                const tIdx = trades.indexOf(w.trade);
                ctx.fillStyle = colors[tIdx%5] || '#FFF'; ctx.shadowBlur = 4; ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath(); ctx.arc(px,py,5,0,2*Math.PI); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = '#94A3B8'; ctx.font = '9px sans-serif'; ctx.fillText(w.name, px+7, py+3);
            });
        }

        function saveConfigToCloud() {
            // 安全机制：防止管理员误清空核心数据导致系统崩溃
            const tVal = document.getElementById('listTrades').value.trim();
            if(!tVal) { alert("⚠️ 错误：工种列表不能为空！"); return; }

            const split = (str) => str.replace(/，/g, ',').split(',').map(i => i.trim()).filter(Boolean);
            const payload = {
                action: "updateConfig",
                config: { 
                    lat: parseFloat(document.getElementById('cfgLat').value), lng: parseFloat(document.getElementById('cfgLng').value), radius: parseInt(document.getElementById('cfgRadius').value),
                    stdIn: document.getElementById('cfgStdIn').value.trim(), stdOut: document.getElementById('cfgStdOut').value.trim(), bufferMin: parseInt(document.getElementById('cfgBufferMin').value)
                },
                options: { trades: split(tVal), areas: split(document.getElementById('listAreas').value), supervisors: split(document.getElementById('listSupervisors').value) }
            };

            document.getElementById('btnSave').innerText = "正在下发同步...";
            
            fetch(API_URL, { 
                method: "POST", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload) 
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') { alert("✅ 规则与环境配置同步成功！"); loadCloudData(); }
            })
            .catch(err => alert("同步失败，请检查网络！"))
            .finally(() => document.getElementById('btnSave').innerText = "下发规则并强制同步");
        }
    </script>
</body>
</html>
