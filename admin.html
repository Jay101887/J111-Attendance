<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>J111项目中枢考勤实时监控与智能布控沙盘</title>
    <style>
        :root { --dark: #1d1d1f; --panel: #ffffff; --border: #d2d2d7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #f5f5f7; display: flex; height: 100vh; color: var(--dark); overflow: hidden; }
        #sidebar { width: 380px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        #map-container { flex: 1; position: relative; background: #e5e5ea; cursor: grab; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        h3 { margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #0071e3; padding-bottom: 6px; }
        .stat-card { background: #fafafa; border: 1px solid var(--border); padding: 12px; border-radius: 10px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-item { font-size: 13px; font-weight: 500; }
        .stat-item span { font-size: 16px; font-weight: bold; color: #0071e3; display: block; }
        textarea { width: 100%; height: 80px; font-size: 12px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); resize: none; margin-bottom: 10px; }
        .btn { background: #0071e3; color: white; padding: 10px; border: none; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .tabs { display: flex; margin-bottom: 15px; background: #eee; padding: 2px; border-radius: 8px; }
        .tab { flex: 1; text-align: center; padding: 6px; font-size: 13px; cursor: pointer; border-radius: 6px; }
        .tab.active { background: white; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-panel { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
        .tab-panel.active { display: flex; }
        .history-row { padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('realtime')">实时动态</div>
        <div class="tab" onclick="switchTab('history-tab')">历史穿透对账</div>
        <div class="tab" onclick="switchTab('config-tab')">围栏控标调整</div>
    </div>

    <div id="realtime" class="tab-panel active">
        <h3>📊 动态生产看板 (07:00滚动)</h3>
        <div class="stat-card">
            <div class="stat-item">当前在场总人数<span id="lbl-inside">0</span></div>
            <div class="stat-item">今日开卡总人数<span id="lbl-active">0</span></div>
            <div class="stat-item">标准白班闭环<span id="lbl-day">0</span></div>
            <div class="stat-item">常规加班闭环<span id="lbl-over">0</span></div>
            <div class="stat-item">再次进场抢修<span id="lbl-extra">0</span></div>
            <div class="stat-item">跨天夜班闭环<span id="lbl-night">0</span></div>
        </div>
        <h3>👷 实时工种配属精细分布</h3>
        <div id="trade-list" style="font-size:13px; line-height: 1.8;"></div>
    </div>

    <div id="history-tab" class="tab-panel">
        <h3>📂 30天历史固化清算日志</h3>
        <div id="history-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <div id="config-tab" class="tab-panel">
        <h3>⚙️ 项目核心电子围栏矩阵</h3>
        <label style="font-size:12px;">中心锚点经度 / 纬度</label>
        <div style="display:flex; gap:5px; margin-bottom:8px;">
            <input type="number" id="cfg-lat" step="0.000001" style="width:50%; padding:6px;">
            <input type="number" id="cfg-lng" step="0.000001" style="width:50%; padding:6px;">
        </div>
        <div style="margin-bottom:8px;">
            <label style="font-size:12px;">现场控标围栏半径(米)</label>
            <input type="number" id="cfg-radius" style="width:100%; padding:6px;">
        </div>
        <div style="display:flex; gap:5px; margin-bottom:8px;">
            <div><label style="font-size:11px;">标准白班开始</label><input type="text" id="cfg-stdin" style="width:100%; padding:4px;"></div>
            <div><label style="font-size:11px;">标准白班截止</label><input type="text" id="cfg-stdout" style="width:100%; padding:4px;"></div>
        </div>
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <div><label style="font-size:11px;">弹性缓冲(分钟)</label><input type="number" id="cfg-buffer" style="width:100%; padding:4px;"></div>
            <div><label style="font-size:11px;">加班门槛起算(分钟)</label><input type="number" id="cfg-rounding" style="width:100%; padding:4px;"></div>
        </div>
        <h3>📋 现场控制数据字典字典（换行输入）</h3>
        <label style="font-size:12px;">可用工种列表</label><textarea id="txt-trades"></textarea>
        <label style="font-size:12px;">控标作业区域</label><textarea id="txt-areas"></textarea>
        <label style="font-size:12px;">授权督工名单</label><textarea id="txt-supervisors"></textarea>
        <button class="btn" onclick="saveConfig()">一键部署并同步云端锁</button>
    </div>
</div>

<div id="map-container"><canvas id="sandBoxMap"></canvas></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzejNYzlV6jmhDHg_sUWZJJdIfkM_iSLemV5KQP9bSXLA3Fd99qg7fehSZN0JE5Yh_s/exec";
    let workers = []; let configBlob = {};
    const canvas = document.getElementById('sandBoxMap'); const ctx = canvas.getContext('2d');
    let scale = 1.0; let offsetX = 0; let offsetY = 0; let isDragging = false; let startX, startY;

    window.onload = function() {
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        initMapInteractions(); pollCloudEngine(); setInterval(pollCloudEngine, 30000);
    };

    function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; drawSandbox(); }
    function switchTab(id) { document.querySelectorAll('.tab, .tab-panel').forEach(el => el.classList.remove('active')); event.target.classList.add('active'); document.getElementById(id).classList.add('active'); }

    function pollCloudEngine() {
        fetch(API_URL).then(res => res.json()).then(res => {
            configBlob = res.config; workers = res.analytics.workers;
            document.getElementById('lbl-inside').innerText = res.analytics.total;
            document.getElementById('lbl-active').innerText = res.analytics.stats.totalActive;
            document.getElementById('lbl-day').innerText = res.analytics.stats.dayClosed;
            document.getElementById('lbl-over').innerText = res.analytics.stats.overClosed;
            document.getElementById('lbl-extra').innerText = res.analytics.stats.extraClosed;
            document.getElementById('lbl-night').innerText = res.analytics.stats.nightClosed;
            
            // 精准映射校准完毕的代码行
            let tHtml = ""; for(let t in res.analytics.stats.trades) { tHtml += `🔹 ${t}: <b>${res.analytics.stats.trades[t]}</b> 人<br>`; }
            document.getElementById('trade-list').innerHTML = tHtml || "暂无人员进场";

            document.getElementById('cfg-lat').value = configBlob.lat; document.getElementById('cfg-lng').value = configBlob.lng;
            document.getElementById('cfg-radius').value = configBlob.radius; document.getElementById('cfg-stdin').value = configBlob.stdIn;
            document.getElementById('cfg-stdout').value = configBlob.stdOut; document.getElementById('cfg-buffer').value = configBlob.bufferMin;
            document.getElementById('cfg-rounding').value = configBlob.roundingMin;
            document.getElementById('txt-trades').value = res.options.trades.join("\n");
            document.getElementById('txt-areas').value = res.options.areas.join("\n");
            document.getElementById('txt-supervisors').value = res.options.supervisors.join("\n");

            let hHtml = ""; res.analytics.history.forEach(h => { hHtml += `<div class="history-row">📅 <b>${h.date.substring(0,10)}</b> | 当天出勤: ${h.total}人<br>⚡ 闭环拆分: ${h.closed}</div>`; });
            document.getElementById('history-list').innerHTML = hHtml || "暂无历史固化断代数据";
            drawSandbox();
        });
    }

    function initMapInteractions() {
        const container = document.getElementById('map-container');
        container.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX - offsetX; startY = e.clientY - offsetY; container.style.cursor = 'grabbing'; });
        window.addEventListener('mouseup', () => { isDragging = false; container.style.cursor = 'grab'; });
        container.addEventListener('mousemove', e => { if (!isDragging) return; offsetX = e.clientX - startX; offsetY = e.clientY - startY; drawSandbox(); });
        container.addEventListener('wheel', e => { e.preventDefault(); if (e.deltaY < 0) scale *= 1.1; else scale /= 1.1; scale = Math.min(Math.max(scale, 0.2), 10); drawSandbox(); }, { passive: false });
    }

    function drawSandbox() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
        ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY); ctx.scale(scale, scale);
        ctx.beginPath(); ctx.arc(0, 0, configBlob.radius || 150, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(0, 113, 227, 0.04)'; ctx.fill(); ctx.strokeStyle = '#0071e3'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#ff453a'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 2 * Math.PI); ctx.fill();
        ctx.fillStyle = '#1d1d1f'; ctx.font = '10px sans-serif'; ctx.fillText("J111 中心锚点", 8, 3);
        workers.forEach(w => {
            ctx.fillStyle = 'rgba(52, 199, 89, 0.85)'; ctx.beginPath(); ctx.arc(w.relX, -w.relY, 3.5, 0, 2 * Math.PI); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = '#1d1d1f'; ctx.font = '9px sans-serif'; ctx.fillText(`${w.name} (${w.trade})`, w.relX + 6, -w.relY + 3);
        });
        ctx.restore();
    }

    function saveConfig() {
        const payload = {
            action: 'updateConfig',
            config: {
                lat: parseFloat(document.getElementById('cfg-lat').value), lng: parseFloat(document.getElementById('cfg-lng').value), radius: parseInt(document.getElementById('cfg-radius').value),
                stdIn: document.getElementById('cfg-stdin').value, stdOut: document.getElementById('cfg-stdout').value, bufferMin: parseInt(document.getElementById('cfg-buffer').value), roundingMin: parseInt(document.getElementById('cfg-rounding').value)
            },
            options: { trades: document.getElementById('txt-trades').value.split("\n").filter(String), areas: document.getElementById('txt-areas').value.split("\n").filter(String), supervisors: document.getElementById('txt-supervisors').value.split("\n").filter(String) }
        };
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }).then(res => res.json()).then(res => { if(res.status === 'success') { alert("🎉 配置同步成功！"); pollCloudEngine(); } });
    }
</script>
</body>
</html>
