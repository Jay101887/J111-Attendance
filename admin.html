<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J111 签到系统 - 管理员后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans flex items-center justify-center">

    <!-- 1. 登录密码锁界面 -->
    <div id="loginOverlay" class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-6">
        <div class="text-center mb-6">
            <span class="text-4xl">🔒</span>
            <h2 class="text-xl font-bold text-gray-800 mt-2">J111 管理员安全认证</h2>
            <p class="text-xs text-gray-500 mt-1">请输入管理密码以访问控制台</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="inputPassword" placeholder="输入密码 (Password)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-800 focus:outline-none">
            <p id="loginError" class="text-xs text-red-500 hidden">❌ 密码错误，拒绝访问！</p>
            <button onclick="verifyAdminPassword()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2.5 rounded-lg shadow transition">
                验证登录
            </button>
        </div>
    </div>

    <!-- 2. 控制台主界面 -->
    <div id="adminContent" class="w-full max-w-4xl bg-white rounded-2xl shadow-lg overflow-hidden hidden">
        <!-- 后台头部 -->
        <div class="bg-gray-800 p-5 text-white flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide">⚙️ J111 项目考勤与现场控制台</h1>
            <button onclick="logoutAdmin()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-lg transition">退出登录</button>
        </div>

        <!-- 标签页切换 -->
        <div class="flex border-b border-gray-200 bg-gray-50">
            <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-3 text-center font-bold text-gray-800 border-b-2 border-gray-800 transition">📊 现场今日看板</button>
            <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 transition">⚙️ 参数范围配置</button>
        </div>

        <div class="p-6">
            <!-- 【板块一：今日分析看板】 -->
            <div id="section-analytics" class="space-y-6">
                <!-- 快捷数字摘要 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
                        <p class="text-sm text-blue-700 font-medium">工地范围内签到总数</p>
                        <p id="stat-total" class="text-3xl font-bold text-blue-900 mt-1">-- 人</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-xl border border-green-200">
                        <p class="text-sm text-green-700 font-medium">当前设定的电子围栏半径</p>
                        <p id="stat-radius" class="text-3xl font-bold text-green-900 mt-1">-- 米</p>
                    </div>
                </div>

                <!-- 核心：现场人员地理坐标平面布置图 -->
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 shadow-inner">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-gray-300 flex items-center">
                            <span class="w-2 h-2 rounded-full bg-green-400 animate-ping mr-2"></span>
                            J111 施工现场人员实时点位平面布置图 (雷达扫描)
                        </h3>
                        <span class="text-xs text-gray-500">圆心为工地中心点</span>
                    </div>
                    
                    <div class="flex flex-col md:flex-row items-center gap-6 justify-center">
                        <!-- 图形画布 -->
                        <div class="relative bg-gray-950 rounded-xl border border-gray-800 p-2">
                            <canvas id="siteMapCanvas" width="320" height="320" class="block"></canvas>
                        </div>
                        
                        <!-- 右侧动态工种图例标记 -->
                        <div class="flex-1 w-full bg-gray-800/40 p-4 rounded-xl border border-gray-700/50">
                            <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">工种颜色图例 (Legend)</h4>
                            <div id="jobLegendContainer" class="grid grid-cols-2 gap-3 text-xs text-gray-300">
                                <!-- 由 JS 动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 传统统计图表区域 -->
                <div class="grid grid-cols-1 gap-6 pt-2">
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <h3 class="text-xs font-bold text-gray-600 mb-2 text-center">各工种出勤人数统计</h3>
                        <canvas id="chartTrades" class="max-h-48"></canvas>
                    </div>
                </div>
            </div>

            <!-- 【板块二：参数范围配置】 -->
            <div id="section-settings" class="space-y-8 hidden">
                <section class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                    <h2 class="text-lg font-bold text-blue-800 mb-4 flex items-center">📍 工地坐标与打卡范围配置</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">中心纬度 (Latitude)</label>
                            <input type="text" id="cfgLat" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">中心经度 (Longitude)</label>
                            <input type="text" id="cfgLng" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">允许打卡半径 (米)</label>
                            <input type="number" id="cfgRadius" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </section>

                <section class="bg-orange-50 p-5 rounded-xl border border-orange-100">
                    <h2 class="text-lg font-bold text-orange-800 mb-4 flex items-center">📝 前端下拉菜单选项管理</h2>
                    <p class="text-sm text-gray-600 mb-4">使用中英文逗号隔开各个选项。</p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">工种列表 (Trades)</label>
                            <textarea id="listTrades" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-orange-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">工作区域 (Areas)</label>
                            <textarea id="listAreas" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-orange-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">负责督工 (Supervisors)</label>
                            <textarea id="listSupervisors" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-orange-500"></textarea>
                        </div>
                    </div>
                </section>

                <div class="pt-4 border-t border-gray-200">
                    <button onclick="saveConfigToCloud()" id="btnSave" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg shadow transition">
                        保存配置并同步至云端
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 请在此替换为你真实的 Google Apps Script 部署链接
        const API_URL = "https://script.google.com/macros/s/你的_WEB_APP_URL/exec";
        const MY_ADMIN_PASSWORD = "J111Admin2026"; 

        // 为不同工作/工种预设的高亮色彩池（现代工程大屏科技感色彩）
        const COLOR_PALETTE = [
            '#3B82F6', // 蓝色
            '#10B981', // 绿色
            '#F59E0B', // 橙色
            '#EC4899', // 粉色
            '#8B5CF6', // 紫色
            '#06B6D4', // 青色
            '#14B8A6', // 薄荷绿
            '#F43F5E'  // 红色
        ];

        let tradeChartInstance = null;

        document.getElementById('inputPassword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyAdminPassword();
        });

        function verifyAdminPassword() {
            const input = document.getElementById('inputPassword').value;
            if (input === MY_ADMIN_PASSWORD) {
                document.getElementById('loginError').classList.add('hidden');
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                document.body.classList.remove('flex', 'items-center');
                loadCloudData();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            document.getElementById('inputPassword').value = "";
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.body.classList.add('flex', 'items-center');
        }

        function switchTab(tabName) {
            const tabAnalytics = document.getElementById('tab-analytics');
            const tabSettings = document.getElementById('tab-settings');
            const secAnalytics = document.getElementById('section-analytics');
            const secSettings = document.getElementById('section-settings');

            if (tabName === 'analytics') {
                tabAnalytics.className = "flex-1 py-3 text-center font-bold text-gray-800 border-b-2 border-gray-800 transition";
                tabSettings.className = "flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 transition";
                secAnalytics.classList.remove('hidden');
                secSettings.classList.add('hidden');
            } else {
                tabSettings.className = "flex-1 py-3 text-center font-bold text-gray-800 border-b-2 border-gray-800 transition";
                tabAnalytics.className = "flex-1 py-3 text-center font-medium text-gray-500 hover:text-gray-700 transition";
                secSettings.classList.remove('hidden');
                secAnalytics.classList.add('hidden');
            }
        }

        function loadCloudData() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('cfgLat').value = data.config.lat || "";
                    document.getElementById('cfgLng').value = data.config.lng || "";
                    document.getElementById('cfgRadius').value = data.config.radius || "";
                    
                    document.getElementById('listTrades').value = data.options.trades.join(',');
                    document.getElementById('listAreas').value = data.options.areas.join(',');
                    document.getElementById('listSupervisors').value = data.options.supervisors.join(',');
                    
                    document.getElementById('stat-radius').innerText = (data.config.radius || 0) + " 米";

                    // ==========================================
                    // 核心：模拟/提取今日成功打卡人员的物理相对坐标点
                    // 格式：{name: 姓名, trade: 工种, relX: 相对中心X米, relY: 相对中心Y米}
                    // ==========================================
                    const mockWorkersInside = [
                        { name: "Ah Seng", trade: "钢筋工", relX: 45, relY: -30 },
                        { name: "Kumar", trade: "钢筋工", relX: 60, relY: -15 },
                        { name: "Ali", trade: "泥水工", relX: -80, relY: 50 },
                        { name: "Wang", trade: "木工", relX: 10, relY: 120 },
                        { name: "Chen", trade: "督工/管理", relX: -15, relY: -10 },
                        { name: "Singh", trade: "泥水工", relX: -95, relY: 20 },
                        { name: "Zhang", trade: "木工", relX: 25, relY: 95 }
                    ];

                    processAndDrawMap(mockWorkersInside, parseInt(data.config.radius || 150));
                })
                .catch(err => alert("⚠️ 同步云端数据失败。"));
        }

        // 核心绘图与分析引擎
        function processAndDrawMap(workers, radius) {
            document.getElementById('stat-total').innerText = workers.length + " 人";

            // 1. 动态为现场出现的工种派发颜色
            const uniqueTrades = [...new Set(workers.map(w => w.trade))];
            const tradeColors = {};
            uniqueTrades.forEach((trade, index) => {
                tradeColors[trade] = COLOR_PALETTE[index % COLOR_PALETTE.length];
            });

            // 2. 渲染右侧动态图例
            const legendContainer = document.getElementById('jobLegendContainer');
            legendContainer.innerHTML = "";
            uniqueTrades.forEach(trade => {
                const count = workers.filter(w => w.trade === trade).length;
                legendContainer.innerHTML += `
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full inline-block" style="background-color: ${tradeColors[trade]}"></span>
                        <span class="truncate">${trade} (${count}人)</span>
                    </div>
                `;
            });

            // 3. 开始在 Canvas 上绘制电子围栏平面布置图
            const canvas = document.getElementById('siteMapCanvas');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const maxMapRadius = cx - 20; // 留出20px外边距

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景同心网格线（电子围栏安全防线）
            ctx.strokeStyle = '#1E293B';
            ctx.lineWidth = 1;
            
            // 外圈围栏
            ctx.beginPath();
            ctx.arc(cx, cy, maxMapRadius, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
            ctx.fill();

            // 内圈（50%半径参考线）
            ctx.beginPath();
            ctx.arc(cx, cy, maxMapRadius * 0.5, 0, 2 * Math.PI);
            ctx.stroke();

            // 绘制十字轴线
            ctx.strokeStyle = '#334155';
            ctx.beginPath(); ctx.moveTo(cx - maxMapRadius, cy); ctx.lineTo(cx + maxMapRadius, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, cy - maxMapRadius); ctx.lineTo(cx, cy + maxMapRadius); ctx.stroke();

            // 标记中心点（项目部/基坑中心位置）
            ctx.fillStyle = '#EF4444';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '10px sans-serif';
            ctx.fillText("工地中心", cx + 8, cy + 4);

            // 4. 将工友的点位投影到平面图上
            workers.forEach(worker => {
                // 将真实的物理米数，等比例缩放到画布像素大小
                // 相对比例 = 实际距离 / 电子围栏设定半径
                const scale = maxMapRadius / radius;
                const ptX = cx + (worker.relX * scale);
                const ptY = cy + (worker.relY * scale); // 北向为负，南向为正

                // 绘制工友点位
                ctx.fillStyle = tradeColors[worker.trade];
                ctx.shadowBlur = 8;
                ctx.shadowColor = tradeColors[worker.trade];
                ctx.beginPath();
                ctx.arc(ptX, ptY, 6, 0, 2 * Math.PI);
                ctx.fill();
                
                // 取消阴影，防止影响文字
                ctx.shadowBlur = 0;

                // 在点位旁侧标注姓名缩写/名字
                ctx.fillStyle = '#94A3B8';
                ctx.font = '9px sans-serif';
                ctx.fillText(worker.name, ptX + 8, ptY + 3);
            });

            // 5. 底部传统的工种柱状图一并刷新
            const tradeCounts = {};
            uniqueTrades.forEach(t => { tradeCounts[t] = workers.filter(w => w.trade === t).length; });

            const ctxTrades = document.getElementById('chartTrades').getContext('2d');
            if(tradeChartInstance) tradeChartInstance.destroy();
            tradeChartInstance = new Chart(ctxTrades, {
                type: 'bar',
                data: {
                    labels: Object.keys(tradeCounts),
                    datasets: [{
                        data: Object.values(tradeCounts),
                        backgroundColor: Object.keys(tradeCounts).map(t => tradeColors[t]),
                        borderRadius: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } 
                }
            });
        }

        function saveConfigToCloud() {
            const btn = document.getElementById('btnSave');
            btn.innerText = "正在同步中...";
            btn.classList.add("opacity-70", "cursor-not-allowed");
            const splitAndClean = (str) => str.replace(/，/g, ',').split(',').map(item => item.trim()).filter(item => item !== "");

            const payload = {
                action: "updateConfig",
                config: {
                    lat: parseFloat(document.getElementById('cfgLat').value),
                    lng: parseFloat(document.getElementById('cfgLng').value),
                    radius: parseInt(document.getElementById('cfgRadius').value)
                },
                options: {
                    trades: splitAndClean(document.getElementById('listTrades').value),
                    areas: splitAndClean(document.getElementById('listAreas').value),
                    supervisors: splitAndClean(document.getElementById('listSupervisors').value)
                }
            };

            fetch(API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
            .then(() => {
                alert("✅ 配置已成功更新至云端表格！");
                btn.innerText = "保存配置并同步至云端";
                btn.classList.remove("opacity-70", "cursor-not-allowed");
            })
            .catch(() => {
                alert("❌ 同步失败");
                btn.innerText = "保存配置并同步至云端";
                btn.classList.remove("opacity-70", "cursor-not-allowed");
            });
        }
    </script>
</body>
</html>
